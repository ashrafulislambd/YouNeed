version: '3.8'

services:
  mongodb:
    image: bitnami/mongodb:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGODB_ROOT_PASSWORD=password123
      - MONGODB_USERNAME=myuser
      - MONGODB_PASSWORD=mypassword
      - MONGODB_DATABASE=mydatabase
    volumes:
      - mongodb_data:/bitnami/mongodb

  auth-service:
    build: ./auth
    container_name: auth-service
    depends_on:
      - mongodb
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://myuser:mypassword@mongodb:27017/mydatabase?authSource=mydatabase
      - DB_NAME=mydatabase
      - PORT=8080
      - JWT_SECRET=your_jwt_secret

  credit-service:
    build: ./credit
    container_name: credit-service
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      - MONGO_URI=mongodb://myuser:mypassword@mongodb:27017/mydatabase?authSource=mydatabase
      - DB_NAME=mydatabase
      - PORT=8081

  payment-service:
    build: ./payment
    container_name: payment-service
    depends_on:
      - mongodb
    ports:
      - "8082:8082"
    environment:
      - MONGO_URI=mongodb://myuser:mypassword@mongodb:27017/mydatabase?authSource=mydatabase
      - DB_NAME=mydatabase
      - PORT=8082

  kyc-service:
    build: ./kyc
    container_name: kyc-service
    depends_on:
      - mongodb
    ports:
      - "8083:8083"
    environment:
      - MONGO_URI=mongodb://myuser:mypassword@mongodb:27017/mydatabase?authSource=mydatabase
      - DB_NAME=mydatabase
      - PORT=8083
      - AUTH_SERVICE_URL=http://auth-service:8080

  otp-service:
    build: ./otp
    container_name: otp-service
    depends_on:
      - mongodb
    ports:
      - "8084:8084"
    environment:
      - MONGO_URI=mongodb://myuser:mypassword@mongodb:27017/mydatabase?authSource=mydatabase
      - DB_NAME=mydatabase
      - PORT=8084
      - OTP_PROVIDER=console
      # To use WhatsApp (paid), uncomment below and set OTP_PROVIDER=whatsapp:
      # - WHATSAPP_TOKEN=your_token_here
      # - WHATSAPP_PHONE_NUMBER_ID=your_phone_number_id
      # - WHATSAPP_TEMPLATE_NAME=otp_verification

volumes:
  mongodb_data:


