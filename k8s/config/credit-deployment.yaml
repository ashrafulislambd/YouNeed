apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-service
  template:
    metadata:
      labels:
        app: credit-service
    spec:
      containers:
      - name: credit-service
        image: credit-service:latest
        ports:
        - containerPort: 8081
        envFrom:
        - secretRef:
            name: credit-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: credit-service
spec:
  selector:
    app: credit-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
